<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Postular</title>
</head>
<body>
<h1>Postular a {{ oferta.puesto }}</h1>


<form action="{{ url_for('postular', oferta_id=oferta._id_str) }}" method="POST" enctype="multipart/form-data">
<label>Nombre:</label>
<input type="text" name="nombre" required>
<br>


<label>Correo:</label>
<input type="email" name="correo" required>
<br>


<label>Currículum (PDF):</label>
<input type="file" name="cv" required>
<br>


<button type="submit">Enviar</button>
</form>
</body>
</html>
