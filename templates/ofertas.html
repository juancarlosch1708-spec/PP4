<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ofertas de Trabajo</title>
</head>
<body>
<h1>Ofertas Disponibles</h1>


{% for oferta in ofertas %}
<div>
<h3>{{ oferta.puesto }}</h3>
<p>{{ oferta.descripcion }}</p>


<!-- BOTÓN POSTULAR -->
<a href="{{ url_for('postular', oferta_id=oferta._id_str) }}">Postular</a>


<!-- BOTÓN VER POSTULANTES -->
<a href="{{ url_for('ver_postulantes', oferta_id=oferta._id_str) }}">Postulantes</a>


<!-- BOTÓN ELIMINAR -->
<form action="{{ url_for('eliminar_oferta', oferta_id=oferta._id_str) }}" method="POST">
<button type="submit">Eliminar</button>
</form>
</div>
<hr>
{% endfor %}
</body>
</html>
